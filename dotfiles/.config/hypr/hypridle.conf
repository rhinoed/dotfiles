general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 480                                # 8min.
    on-timeout = ~/.config/hypr/scripts/brightness.sh min   # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = ~/.config/hypr/scripts/brightness.sh restore # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 480                                          # 8min.
#     on-timeout = ~/.config/hypr/scripts/kbdbacklight.sh off # FreeBSD: sysctl dev.acpi_kbd.brightness
#     on-resume = ~/.config/hypr/scripts/kbdbacklight.sh on   # turn back on the keyboard backlight.
# }

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660                                                     # 11min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && ~/.config/hypr/scripts/brightness.sh restore # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = loginctl suspend                 # suspend pc (FreeBSD/elogind)
}
